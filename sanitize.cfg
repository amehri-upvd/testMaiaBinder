[regex]
# 1. Gestion des adresses mémoire et context managers (Cell 1)
regex1 = <contextlib\._GeneratorContextManager at 0x[0-9a-f]+>
replace1 = <contextlib._GeneratorContextManager>

# 2. Messages CGNS et temps d'exécution (Cells 2,11,13)
regex2 = Distributed read of file.*\.cgns.*
replace2 = [CGNS file loaded]

regex3 = Read completed \(\d+\.\d+\s*s\).*MiB
replace3 = [Read completed - X MiB]

regex4 = Partitioning completed \(\d+\.\d+\s*s\).*K
replace4 = [Partitioning completed]

regex5 = Wall distance computed \(\d+\.\d+\s*s\)
replace5 = [Wall distance computed]

regex6 = Plane slice completed \(\d+\.\d+\s*s\)
replace6 = [Plane slice completed]

# 6. Angles de rotation spécifiques (Cells 3,7,8,9,11)
regex11 = RotationAngle DataArray_t R8 \[-?0\.\d+\]
replace11 = RotationAngle DataArray_t R8 [X.XXX]

# 3. Nombres flottants et précision (Cells 3,5,7,8,9)
regex7 = \d\.\d{5,}
replace7 = X.XXXXX

regex8 = \[-?\d\.\d{3,}
replace8 = [X.XXX

# 4. Codes couleur ANSI
regex9 = \\x1b\[[0-9;]*[mK]
replace9 = 

# 5. Structure d'arbre CGNS (simplification)
regex10 = (├───|└───).*
replace10 = [Tree branch]

